<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="s/base.css"><script src="s/gsap.min.js"></script>
<style>#hd{position:absolute;left:110px;top:90px} #g{position:absolute;left:110px;right:110px;top:330px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.c{padding:40px 36px;height:270px} .c .v{font-size:74px;font-weight:800;color:var(--teal);line-height:1.05} .c .s{margin-top:14px;font-size:30px;font-weight:600;color:var(--soft)}</style></head>
<body><div class="root" id="root" data-composition-id="proof" data-width="1920" data-height="1080" data-duration="7">
<div id="hd"><div class="label">SHIPPED, NOT A PROTOTYPE</div><div class="h1 serif" style="margin-top:18px">Real app. Real people. Real water.</div></div>
<div id="g">
<div class="c card" id="c1"><div class="v">Live</div><div class="s">on the App Store</div></div>
<div class="c card" id="c2"><div class="v">1 day</div><div class="s">from launch to 1.0.1, built from user feedback</div></div>
<div class="c card" id="c3"><div class="v">1st</div><div class="s">paying user in week one</div></div>
<div class="c card" id="c4"><div class="v">75%</div><div class="s">win-back in-app click rate</div></div>
<div class="c card" id="c5"><div class="v">15</div><div class="s">voices, one OneSignal template</div></div>
<div class="c card" id="c6"><div class="v">0</div><div class="s">accounts, health data stays on the phone</div></div>
</div>
<script>const tl=gsap.timeline({paused:true});
tl.fromTo("#hd",{y:30,opacity:0},{y:0,opacity:1,duration:.5},0);
for(let i=1;i<=6;i++) tl.fromTo("#c"+i,{y:50,opacity:0,scale:.94},{y:0,opacity:1,scale:1,duration:.45,ease:"back.out(1.6)"},.5+i*.28);
tl.to("#g",{y:-6,duration:4,ease:"none"},2.5);
window.__timelines={proof:tl};</script></div></body></html>
